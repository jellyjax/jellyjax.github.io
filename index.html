<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JellyJax · Neverland</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0f;
    color: #e4e0d8;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .stars {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(1px 1px at 20% 30%, #fff3 0 2px, transparent 2px),
                radial-gradient(1px 1px at 60% 10%, #fff2 0 2px, transparent 2px),
                radial-gradient(1.5px 1.5px at 80% 60%, #fff2 0 2px, transparent 2px),
                radial-gradient(1px 1px at 40% 80%, #fff1 0 2px, transparent 2px),
                radial-gradient(1px 1px at 10% 50%, #fff2 0 2px, transparent 2px),
                radial-gradient(1px 1px at 90% 20%, #fff1 0 2px, transparent 2px),
                radial-gradient(1.5px 1.5px at 30% 70%, #fff1 0 2px, transparent 2px),
                radial-gradient(1px 1px at 70% 40%, #fff1 0 2px, transparent 2px);
    background-size: 400px 400px;
    opacity: 0.6;
  }
  .container {
    text-align: center;
    z-index: 1;
    padding: 2rem;
  }
  .heart {
    font-size: 2.2rem;
    display: inline-block;
    animation: pulse 2s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255, 120, 140, 0.25));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  h1 {
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    margin: 1.2rem 0 0.6rem;
    background: linear-gradient(135deg, #e4e0d8 0%, #b8aeb0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub {
    font-size: 1rem;
    color: #7a7278;
    letter-spacing: 0.15em;
    font-weight: 300;
    margin-bottom: 2rem;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: #3a3538;
    margin: 0 auto 2rem;
  }
  .status {
    font-size: 0.85rem;
    color: #5a5558;
    letter-spacing: 0.1em;
  }
  .status span {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #76b852;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    box-shadow: 0 0 6px rgba(118, 184, 82, 0.4);
  }
  .footer {
    position: fixed;
    bottom: 2rem;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    color: #3a3538;
    letter-spacing: 0.05em;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
  <div class="heart">♡</div>
  <h1>JellyJax</h1>
  <p class="sub">Always · Neverland</p>
  <div class="divider"></div>
  <p class="status"><span></span>Coming Soon</p>
</div>
<div class="footer">jellyjax.xyz</div>
</body>
</html>
